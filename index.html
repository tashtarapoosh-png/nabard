<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>بازی قلعه‌ها</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#18202a;color:#f2f4f7}body.battle-background{background:#18202a url("images/zamine.png") center center/cover fixed no-repeat}
body.battle-background.battle-defender-view::before{content:"";position:fixed;inset:0;z-index:0;background:url("images/zamine.png") center center/cover no-repeat;pointer-events:none}button,select,input{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 18px;background:#2f7dce;color:#fff}.exit{background:#8e3b3b}.back{background:#59636f}.screen{display:none;max-width:1100px;margin:auto;padding:24px}.screen.active{display:block}.card{background:#222d38;border:1px solid #3a4652;border-radius:12px;padding:18px;margin-bottom:16px}.grid,.targets,.slots{display:grid;gap:12px}.grid{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}.targets{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.slots{grid-template-columns:repeat(3,1fr)}.castle-btn{min-height:70px;font-size:18px}.actions{display:flex;flex-wrap:wrap;gap:10px}.info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat,.slot,.target{background:#18212a;border-radius:8px;padding:14px}.stat{text-align:center}.slot,.target{border:1px solid #3a4652}.target.selected{border-color:#4aa3ff}.defense-list{margin:8px 0 0;padding:0;list-style:none;color:#cbd5df}.side-select{width:100%;margin-top:10px;padding:8px;border-radius:7px;border:1px solid #59636f;background:#111820;color:#fff}.battle-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}.battle-table th,.battle-table td{border:1px solid #46525e;padding:9px;text-align:center}.battle-table th{background:#111820}.table-wrap{overflow:auto}.side-title{margin-top:24px}.slot label{display:block;margin:7px 0}.slot input,.slot select{width:100%;padding:9px;border-radius:7px;border:1px solid #59636f;background:#111820;color:#fff}.timer{font-size:34px;text-align:center;padding:18px;background:#111820;border-radius:10px;margin:16px 0}
.battle-card{position:relative}
.rand-timer-box{position:absolute;top:14px;left:14px;min-width:100px;text-align:center;background:#111820;border:1px solid #46525e;border-radius:8px;padding:7px 10px;display:none;direction:rtl}
.rand-timer-value{font-size:24px;font-weight:800;line-height:1.1}
.rand-war-value{font-size:13px;font-weight:700;margin-top:4px}.notice{padding:12px;border-radius:8px;background:#263747;margin-bottom:12px}.battle-background #battle{position:fixed;inset:0;z-index:1;width:100vw;height:100vh;max-width:none;min-height:0;margin:0;padding:0;overflow:hidden}.battle-background .battle-card{position:relative;width:100%;height:100%;background:transparent;border:0;border-radius:0;padding:0;margin:0}.battle-background .battle-card>h2,.battle-background #battleText,.battle-background #battleTables{display:none}.battle-background .battle-scene-wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(58vh,46vw);height:min(96vh,calc(46vw * 1.6666667));margin:0}.battle-background .battle-scene-wrap>h3,.battle-background .battle-legend{display:none}.battle-background .battle-grid{width:100%;height:100%;min-height:0;max-height:none;overflow:hidden}.battle-background .battle-cell{background:rgba(255,255,255,.025);border:1px solid rgba(50,60,35,.20)}.battle-background .battle-cell small{display:none}.battle-background .battle-unit{height:100%}.battle-background .battle-unit img{object-fit:contain}.battle-background .rand-timer-box{top:18px;left:18px;z-index:20;background:rgba(24,32,42,.72);backdrop-filter:blur(3px)}.battle-background #battle .actions{position:absolute;z-index:30;top:18px;right:18px;display:flex;gap:8px;margin:0}.battle-background #battle .actions button{padding:8px 13px;background:rgba(24,32,42,.72);backdrop-filter:blur(3px);border:1px solid rgba(255,255,255,.25);box-shadow:0 2px 8px rgba(0,0,0,.25)}.battle-background #battle .actions button:first-child{background:rgba(47,125,206,.78)}.battle-background #battle .actions button.exit{background:rgba(142,59,59,.78)}.battle-background #battle .actions button.back{background:rgba(89,99,111,.78)}.battle-background #battle .actions:nth-last-child(1){position:absolute;left:auto;right:18px;top:58px;transform:none;display:flex;flex-direction:column;align-items:center;gap:8px;margin:0}.battle-background #battle .actions:nth-last-child(1) button:first-child{display:none}.battle-background #battle .actions:nth-last-child(1) button.exit{display:block}.battle-background .battle-castle-image,.battle-background .battle-tent-image{position:absolute;left:50%;z-index:25;pointer-events:none;object-fit:contain;display:block}.battle-background .battle-castle-image{top:0;transform:translateX(-50%);width:clamp(70px,18vw,150px);max-height:10vh}.battle-background .battle-tent-image{bottom:0;transform:translateX(-50%);width:clamp(65px,16vw,140px);max-height:10vh}
@media(max-width:650px){.info,.slots{grid-template-columns:1fr}.screen{padding:14px}.battle-background .battle-scene-wrap{width:min(82vw,58vh);height:min(96vh,calc(min(82vw,58vh) * 1.6666667))}.battle-background #battle .actions{top:12px;right:12px}.battle-background #battle .actions:nth-last-child(1){left:auto;right:12px;top:58px;transform:none}.battle-background .rand-timer-box{top:58px;left:12px}}

.battle-scene-wrap{margin-top:16px;width:100%;position:relative}
.battle-legend{display:flex;gap:18px;justify-content:center;margin:8px 0 12px;font-weight:700}
.battle-grid{position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(20,minmax(0,1fr));gap:0;width:100%;height:min(78vh,980px);min-height:700px;overflow:hidden;border:0;padding:0;background:transparent;isolation:isolate}
.battle-cell{height:auto;min-height:0;width:auto;background:rgba(255,255,255,.035);color:#111;border:1px solid rgba(80,80,80,.30);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:11px;line-height:1.25;padding:3px;box-sizing:border-box;transform:none;transform-origin:center center}
.battle-cell small{font-size:9px;color:#555;opacity:1}.battle-grid{scrollbar-width:auto}
.battle-cell strong{font-size:11px;font-weight:800;color:#111}
.battle-cell span{font-size:10px;font-weight:700;color:#111}
.battle-cell .unit-symbol{font-size:18px;line-height:18px;margin-bottom:2px}
.battle-unit{position:relative;width:100%;height:calc(100% - 12px);min-height:0;padding:0;border:0;border-radius:6px;background:transparent;color:#111;display:block;cursor:pointer;overflow:hidden}
.battle-unit img{width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;display:block}
.battle-unit .unit-castle{position:absolute;top:2px;right:3px;z-index:2;background:rgba(255,255,255,.85);border-radius:3px;padding:1px 4px;font-size:10px;font-weight:800;color:#111}
.battle-unit .army-number{position:absolute;top:2px;right:3px;z-index:3;background:rgba(255,255,255,.9);border-radius:3px;padding:1px 5px;font-size:11px;font-weight:900;color:#111;line-height:1.1}.battle-unit .unit-count{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);z-index:2;background:rgba(255,255,255,.9);border-radius:3px;padding:1px 5px;font-size:10px;font-weight:800;color:#111}
.battle-unit .unit-image-fallback{display:none;position:absolute;inset:0;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#111}
.battle-unit.selectable:hover{outline:2px solid #4aa3ff}
.battle-unit.selected{outline:3px solid #ffd23f;border-radius:6px}
.battle-unit.not-selectable{cursor:default;opacity:1}
.battle-cell.selected-cell{box-shadow:inset 0 0 0 3px #ffd23f}
.battle-cell.move-option{background:rgba(255,210,63,.45)!important;box-shadow:inset 0 0 0 2px #d39b00;cursor:pointer}.battle-cell.move-target{background:rgba(72,187,120,.65)!important;box-shadow:inset 0 0 0 3px #18794e}
.battle-units-table-wrap{margin-top:14px}
.battle-cell.attacker{background:rgba(220,236,255,.28);border:2px solid #3878c8}
.battle-cell.defender{background:rgba(255,224,224,.28);border:2px solid #c83b3b}
@media(max-width:800px){
  .battle-grid{height:78vh;min-height:560px}
}

/* fixed19: هم‌ترازی مستقیم زمین بازی با زمین چمن تصویر پس‌زمینه */
.battle-background{
  background-size:100% 100% !important;
  background-position:center center !important;
}
.battle-background .battle-scene-wrap{
  position:absolute;
  inset:3.5% 0 3.5% 0;
  width:100%;
  height:93%;
  margin:0;
  transform:none;
  overflow:hidden;
}
.battle-background .battle-grid{
  width:100%;
  height:100%;
  min-height:0;
  max-height:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow:hidden;
  background:transparent;
  border:0;
  padding:0;
  clip-path:none;
}
.battle-background .battle-row{
  width:var(--row-width);
  height:5%;
  min-height:0;
  flex:0 0 5%;
  display:grid;
  grid-template-columns:repeat(12,minmax(0,1fr));
  margin:0 auto;
}
.battle-background .battle-cell{
  width:auto;
  height:100%;
  min-height:0;
  padding:0;
  background:rgba(255,255,255,.018);
  border:1px solid rgba(50,60,35,.16);
}
.battle-background .battle-cell.attacker{background:rgba(80,150,255,.12);border:1px solid rgba(56,120,200,.45)}
.battle-background .battle-cell.defender{background:rgba(255,80,80,.12);border:1px solid rgba(200,59,59,.45)}
.battle-background .battle-unit{height:100%;width:100%;border-radius:0}
.battle-background .battle-unit img{width:100%;height:100%;object-fit:contain}

.battle-background.battle-defender-view .battle-castle-image{top:auto;bottom:0;transform:translateX(-50%)}
.battle-background.battle-defender-view .battle-tent-image{bottom:auto;top:0;transform:translateX(-50%)}
@media(max-width:650px){
  .battle-background .battle-scene-wrap{inset:3% 0 3% 0;width:100%;height:94%}
}
@media(max-width:650px){
  }
</style></head>
<body>
<section id="select" class="screen active"><div class="card"><h1>انتخاب قلعه</h1><p>قلعه ۱ تا ۱۰</p><div id="castleGrid" class="grid"></div><div class="actions" style="margin-top:16px"><button id="randomDefenseBtn">چینش دفاعی تصادفی همه قلعه‌ها</button><button id="resetAllBattlesBtn" class="exit">بستن همه نبردها</button></div></div></section>
<section id="castle" class="screen"><div class="card"><h2 id="castleTitle"></h2><div class="info"><div class="stat">کماندار<br><b>100</b></div><div class="stat">سواره‌نظام<br><b>100</b></div><div class="stat">شمشیرزن<br><b>100</b></div></div><div id="castleTimer" class="timer" style="display:none">00:10</div><div id="castleTimerInfo" class="notice" style="display:none"></div></div><div class="card"><div class="actions"><button id="attackBtn">حمله</button><button id="battleBtn">ورود به نبرد</button><button id="defenseBtn">چینش دفاعی</button><button id="castleBack" class="back">برگشت به انتخاب قلعه</button><button class="exit" onclick="exitGame()">خروج</button></div></div></section>
<section id="defense" class="screen"><div class="card"><h2 id="defenseTitle"></h2><p>چینش دفاعی را در ۶ ردیف، مشابه صفحه حمله، وارد کنید.</p><div id="defenseSlots" class="slots"></div><div class="actions" style="margin-top:14px"><button id="saveDefense">ذخیره چینش دفاعی</button><button id="defenseBack" class="back">برگشت</button><button class="exit" onclick="exitGame()">خروج</button></div></div></section>
<section id="targets" class="screen"><div class="card"><h2>انتخاب هدف</h2><p>قلعه‌های ۲ تا ۱۱</p><div id="targetGrid" class="targets"></div><div class="actions" style="margin-top:14px"><button id="targetContinue">ادامه</button><button id="targetBack" class="back">برگشت</button><button class="exit" onclick="exitGame()">خروج</button></div></div></section>
<section id="attack" class="screen"><div class="card"><h2 id="attackTitle"></h2><p>نوع و تعداد نیرو را در هر یک از ۶ ستون وارد کنید.</p><div id="attackSlots" class="slots"></div><div class="actions" style="margin-top:14px"><button id="startAttack">حمله</button><button id="attackBack" class="back">برگشت</button><button class="exit" onclick="exitGame()">خروج</button></div></div></section>

<section id="timerScreen" class="screen"><div class="card"><h2>نیرو در حال حرکت است</h2><div id="timer" class="timer">00:10</div><div id="timerInfo" class="notice"></div></div></section>
<section id="battle" class="screen"><div class="card battle-card"><img class="battle-castle-image" src="images/castle.png" alt="قلعه"><img class="battle-tent-image" src="images/tent.png" alt="چادر"><div id="randTimerBox" class="rand-timer-box"><div id="randTimerValue" class="rand-timer-value">00:20</div><div id="randWarValue" class="rand-war-value">راند: 0</div></div><h2>نتیجه نبرد</h2><p id="battleText">آماده نبرد</p><div class="actions" style="margin:14px 0">
  <button id="battleSceneBtn">نمایش صحنه نبرد</button>
  <button id="endBattleBtn" class="exit">پایان نبرد</button>
</div>
<div id="battleTables"></div>
<div id="battleScene" style="display:none"></div><div class="actions" style="margin-top:14px"><button id="battleBack" class="back">برگشت</button><button class="exit" onclick="exitGame()">خروج</button></div></div></section>
<script>
"use strict";

const castles={};
for(let i=1;i<=11;i++){
  castles[i]={
    id:i,
    name:"قلعه "+i,
    army:{archer:100,cavalry:100,swordsman:100},
    defenseSlots:Array.from({length:6},()=>({type:"",count:0}))
  };
}
const names={archer:"کماندار",cavalry:"سواره‌نظام",swordsman:"شمشیرزن"};

// تصاویر نیروها؛ از همان مسیر استاندارد بازی بارگذاری می‌شوند.
const images={
  archer:{1:new Image(),2:new Image()},
  cavalry:{1:new Image(),2:new Image()},
  swordsman:{1:new Image(),2:new Image()}
};
images.archer[1].src="images/archer1.png";
images.archer[2].src="images/archer2.png";
images.cavalry[1].src="images/cavalry1.png";
images.cavalry[2].src="images/cavalry2.png";
images.swordsman[1].src="images/swordsman1.png";
images.swordsman[2].src="images/swordsman2.png";

const typeOptions='<option value="">انتخاب</option><option value="archer">کماندار</option><option value="cavalry">سواره‌نظام</option><option value="swordsman">شمشیرزن</option>';

let u={castle:null};
let selectedCastleId=null;
let selectedTargetId=null;
let attackData=null;
let timerId=null;
let nextBattleId=1;
const battleRegistry={};
let remainingSeconds=10;
let randTimerId=null;
let randStarted=false;
let randwar=0;
let randRemainingSeconds=20;
let currentBattleForScene=null;

function show(id){
  document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.body.classList.toggle("battle-background",id==="battle");
  if(id==="battle") setBattlePerspective();
}

function exitGame(){
  if(timerId) clearInterval(timerId);
  timerId=null;
  selectedCastleId=null;
  selectedTargetId=null;
  attackData=null;
  remainingSeconds=10;
  document.getElementById("castleTimer").style.display="none";
  document.getElementById("castleTimerInfo").style.display="none";
  show("select");
}

function openCastle(id){
  selectedCastleId=id;
  document.getElementById("castleTitle").textContent=castles[id].name+" - شماره قلعه "+id;
  show("castle");
}

function randomizeAllDefenses(){
  const types=["archer","cavalry","swordsman"];

  for(let castleId=1;castleId<=11;castleId++){
    const slots=Array.from({length:6},()=>({type:"",count:0}));
    const unitCount=1+Math.floor(Math.random()*6);

    for(let i=0;i<unitCount;i++){
      const type=types[Math.floor(Math.random()*types.length)];
      const count=1+Math.floor(Math.random()*100);
      slots[i]={type,count};
    }

    castles[castleId].defenseSlots=slots;
  }

  alert("چینش دفاعی تصادفی برای همه قلعه‌ها ساخته شد.");
}

function renderCastles(){
  const g=document.getElementById("castleGrid");
  g.innerHTML="";
  for(let i=1;i<=10;i++){
    const b=document.createElement("button");
    b.className="castle-btn";
    b.textContent=castles[i].name;
    b.onclick=()=>openCastle(i);
    g.appendChild(b);
  }
}

function renderSixSlots(containerId,prefix,values){
  const b=document.getElementById(containerId);
  b.innerHTML="";
  for(let i=0;i<6;i++){
    const value=values?.[i]||{type:"",count:0};
    const d=document.createElement("div");
    d.className="slot";
    d.innerHTML=
      '<b>ردیف '+(i+1)+'</b>'+
      '<label>نوع نیرو</label>'+
      '<select id="'+prefix+'-type-'+i+'">'+typeOptions+'</select>'+
      '<label>تعداد</label>'+
      '<input id="'+prefix+'-count-'+i+'" type="number" min="0" max="100" value="'+Number(value.count||0)+'">';
    b.appendChild(d);
    document.getElementById(prefix+"-type-"+i).value=value.type||"";
  }
}

function renderDefense(){
  const c=castles[selectedCastleId];
  document.getElementById("defenseTitle").textContent="چینش دفاعی - "+c.name;
  renderSixSlots("defenseSlots","def",c.defenseSlots);
}

function readSixSlots(prefix){
  const slots=[];
  for(let i=0;i<6;i++){
    const type=document.getElementById(prefix+"-type-"+i).value;
    const count=Math.max(0,Math.min(100,parseInt(document.getElementById(prefix+"-count-"+i).value)||0));
    slots.push({type,count});
  }
  return slots;
}

function saveDefense(){
  const slots=readSixSlots("def");
  const used=slots.filter(x=>x.type&&x.count>0);
  if(used.length>6)return;
  castles[selectedCastleId].defenseSlots=slots;
  alert("چینش دفاعی ذخیره شد.");
}

function renderTargets(){
  const g=document.getElementById("targetGrid");
  g.innerHTML="";
  selectedTargetId=null;

  for(let i=2;i<=11;i++){
    const c=castles[i];
    const d=document.createElement("div");
    d.className="target";

    const summary=c.defenseSlots
      .filter(x=>x.type&&x.count>0)
      .map(x=>"<li>"+names[x.type]+": "+x.count+"</li>")
      .join("");

    d.innerHTML=
      '<b>'+c.name+'</b>'+
      '<ul class="defense-list">'+(summary||"<li>هنوز چینش دفاعی ثبت نشده</li>")+'</ul>'+
      '<label>ساید هدف</label>'+
      '<select class="side-select" id="target-side-'+i+'"><option value="مدافع">مدافع</option><option value="مهاجم">مهاجم</option></select>';

    d.onclick=e=>{
      if(e.target.tagName==="SELECT")return;
      document.querySelectorAll(".target").forEach(x=>x.classList.remove("selected"));
      d.classList.add("selected");
      selectedTargetId=i;
    };
    g.appendChild(d);
  }
}

function renderAttackSlots(){
  renderSixSlots("attackSlots","at",Array.from({length:6},()=>({type:"",count:0})));
}

function collectAttack(){
  return readSixSlots("at");
}





function beginTimer(){
  remainingSeconds=10;
  document.getElementById("timer").textContent="00:10";
  document.getElementById("timerInfo").textContent=castles[attackData.attackerId].name+" → "+castles[attackData.targetId].name;

  document.getElementById("castleTimer").style.display="block";
  document.getElementById("castleTimerInfo").style.display="block";
  document.getElementById("castleTimerInfo").textContent="حمله به "+castles[attackData.targetId].name+" در حال انجام است.";

  show("castle");

  if(timerId)clearInterval(timerId);
  timerId=setInterval(()=>{
    remainingSeconds--;

    if(remainingSeconds<=0){
      clearInterval(timerId);
      timerId=null;
      remainingSeconds=0;
      batman();
      return;
    }

    updateTimer();
    updateCastleTimer();
  },1000);
}

function updateTimer(){
  document.getElementById("timer").textContent=
    String(Math.floor(remainingSeconds/60)).padStart(2,"0")+":"+
    String(remainingSeconds%60).padStart(2,"0");
}

function updateCastleTimer(){
  document.getElementById("castleTimer").textContent=
    String(Math.floor(remainingSeconds/60)).padStart(2,"0")+":"+
    String(remainingSeconds%60).padStart(2,"0");
}

function startAttack(){
  if(!selectedTargetId)return alert("ابتدا هدف را انتخاب کنید.");

  const slots=collectAttack();
  const used=slots.filter(x=>x.type&&x.count>0);
  if(used.length<1||used.length>6)return alert("هر ارتش باید بین ۱ تا ۶ واحد نیرو داشته باشد.");

  const source=castles[selectedCastleId];
  const totals={archer:0,cavalry:0,swordsman:0};

  for(const slot of used) totals[slot.type]+=slot.count;

  for(const t in names){
    if(totals[t]>source.army[t])
      return alert("تعداد "+names[t]+" بیشتر از نیروهای موجود است.");
  }

  for(const t in names) source.army[t]-=totals[t];

  attackData={
    attackerId:selectedCastleId,
    targetId:selectedTargetId,
    armySide:document.getElementById("target-side-"+selectedTargetId).value,
    attackerSlots:slots,
    startedAt:Date.now()
  };

  beginTimer();
}


function setBattlePerspective(){
  const battle=getCurrentBattle();
  const isDefender=!!(battle && selectedCastleId!==null && (battle.armies||[]).some(army=>String(army.castleId)===String(selectedCastleId) && army.side==="مدافع"));
  document.body.classList.toggle("battle-defender-view",isDefender);
}

function viobat(){
  const scene=document.getElementById("battleScene");
  const battle=getCurrentBattle();
  if(!battle)return;
  currentBattleForScene=battle;

  const units=battle.armies.flatMap(army=>army.units||[]);
  const unitMap=new Map(units.map(u=>[u.cell,u]));
  const defenderView=document.body.classList.contains("battle-defender-view");
  let selectedUnitId=null;

  function getUnitImage(unit){
    const type=String(unit.rawType||"");
    const side=unit.side==="مهاجم"?1:2;
    return images[type]&&images[type][side] ? images[type][side] : null;
  }

  function moveRange(unit){
    const range=(unit.rawType==="cavalry")?2:1;
    const cells=[];
    for(let y=Math.max(0,unit.y-range);y<=Math.min(19,unit.y+range);y++){
      for(let x=Math.max(0,unit.x-range);x<=Math.min(11,unit.x+range);x++){
        if(x===unit.x&&y===unit.y)continue;
        cells.push(String.fromCharCode(65+y)+(x+1));
      }
    }
    return cells;
  }

  function refreshRange(){
    scene.querySelectorAll('.battle-cell.move-option').forEach(cell=>cell.classList.remove('move-option'));
    scene.querySelectorAll('.battle-cell.move-target').forEach(cell=>cell.classList.remove('move-target'));
    if(!selectedUnitId)return;
    const unit=units.find(item=>String(item.id)===String(selectedUnitId));
    if(!unit)return;
    const range=new Set(moveRange(unit));
    scene.querySelectorAll('.battle-cell').forEach(cell=>{
      if(range.has(cell.dataset.cell))cell.classList.add('move-option');
    });
    if(unit.moveTarget){
      const target=scene.querySelector('.battle-cell[data-cell="'+unit.moveTarget+'"]');
      if(target)target.classList.add('move-target');
    }
  }

  function selectUnit(unit){
    selectedUnitId=String(unit.id);
    const button=scene.querySelector('.battle-unit[data-unit-id="'+unit.id+'"]');
    if(button){
    }
    scene.querySelectorAll('.battle-unit.selected').forEach(x=>x.classList.remove('selected'));
    if(button)button.classList.add('selected');
    scene.querySelectorAll('.battle-cell.selected-cell').forEach(x=>x.classList.remove('selected-cell'));
    const cell=scene.querySelector('.battle-cell[data-cell="'+unit.cell+'"]');
    if(cell)cell.classList.add('selected-cell');
    refreshRange();
  }

  let out='<div class="battle-scene-wrap"><h3>صحنه نبرد — ۱۲ ستون × ۲۰ ردیف</h3>';
  out+='<div class="battle-legend"><span>🔵 مهاجم</span><span>🔴 مدافع</span><span>🟨 محدوده حرکت</span><span>🟩 مقصد انتخاب‌شده</span></div>';
  out+='<div class="battle-grid">';

  for(let visualY=0;visualY<20;visualY++){
    // در نمای مدافع فقط ترتیب نمایش برعکس می‌شود؛ شکل زمینه و خود بلوک‌ها ثابت می‌مانند.
    const y=defenderView ? 19-visualY : visualY;
    const rowWidth=(55.2 + (visualY/19)*36.8).toFixed(3);
    out+='<div class="battle-row" style="--row-width:'+rowWidth+'%;">';
    for(let visualX=0;visualX<12;visualX++){
      const x=defenderView ? 11-visualX : visualX;
      const cell=String.fromCharCode(65+y)+(x+1);
      const unit=unitMap.get(cell);
      const cls=unit?(unit.side==="مهاجم"?"attacker":"defender"):"";

      out+='<div class="battle-cell '+cls+'" data-cell="'+cell+'">';
      out+='<small>'+cell+'</small>';

      if(unit){
        const canSelect=String(unit.castle)===String(selectedCastleId);
        const army=battle.armies.find(item=>(item.units||[]).some(itemUnit=>String(itemUnit.id)===String(unit.id)));
        const armyNumber=army ? battle.armies.indexOf(army)+1 : "";
        out+='<button type="button" class="battle-unit '+(canSelect?'selectable':'not-selectable')+'" data-unit-id="'+unit.id+'" data-castle="'+unit.castle+'">';
        const image=getUnitImage(unit);
        const imageSrc=image ? image.src : "";
        out+='<img src="'+imageSrc+'" alt="'+unit.type+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\';">';
        out+='<span class="army-number">'+armyNumber+'</span>';
        out+='<span class="unit-image-fallback">'+unit.type+'</span>';
        out+='<span class="unit-count">'+unit.count+'</span>';
        out+='</button>';
      }

      out+='</div>';
    }
    out+='</div>';
  }
  out+='</div>';

  out+='</div>';

  scene.innerHTML=out;
  scene.style.display="block";

  scene.querySelectorAll('.battle-unit').forEach(btn=>{
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      const unit=units.find(item=>String(item.id)===String(this.dataset.unitId));
      if(!unit)return;
      if(String(unit.castle)===String(selectedCastleId))selectUnit(unit);
    });
  });

  scene.querySelectorAll('.battle-cell').forEach(cell=>{
    cell.addEventListener('click',function(){
      if(!selectedUnitId)return;
      const unit=units.find(item=>String(item.id)===String(selectedUnitId));
      if(!unit)return;
      const destination=this.dataset.cell;
      if(!moveRange(unit).includes(destination))return;
      unit.moveTarget=destination;
      refreshRange();
    });
  });
}

function jang(){
  const battle=getCurrentBattle();
  if(!battle)return;

  const units=battle.armies.flatMap(army=>army.units||[]);
  const aliveUnits=units.filter(unit=>Number(unit.count)>0);

  const attackRange=unit=>unit.rawType==="archer"?2:1;
  const attackDamagePerSoldier=unit=>100;

  const typeMultiplier=(attacker,target)=>{
    if(attacker.rawType==="archer"&&target.rawType==="cavalry")return 2;
    if(attacker.rawType==="cavalry"&&target.rawType==="swordsman")return 2;
    if(attacker.rawType==="swordsman"&&target.rawType==="cavalry")return 2;
    return 1;
  };

  aliveUnits.forEach(unit=>{
    const range=attackRange(unit);

    // تمام واحدهای دشمنِ داخل برد این مهاجم را پیدا می‌کنیم.
    const targets=aliveUnits.filter(target=>{
      if(target===unit)return false;
      if(target.side===unit.side)return false;

      const dx=Math.abs(Number(target.x)-Number(unit.x));
      const dy=Math.abs(Number(target.y)-Number(unit.y));
      return dx<=range&&dy<=range;
    });

    if(!targets.length)return;

    // کل ضربه مهاجم بین اهداف، متناسب با تعداد نیروهای هر هدف تقسیم می‌شود.
    const totalTargetCount=targets.reduce((sum,target)=>sum+Number(target.count),0);
    if(totalTargetCount<=0)return;

    const totalDamage=Number(unit.count)*attackDamagePerSoldier(unit);

    targets.forEach(target=>{
      const targetCount=Number(target.count);
      const share=targetCount/totalTargetCount;
      const damage=totalDamage*share*typeMultiplier(unit,target);
      const targetHealth=Number(target.health);
      target.health=Math.max(0,targetHealth-damage);
    });
  });
}

function fotjang(){
  const battle=getCurrentBattle();
  if(!battle)return;

  const healthPerSoldier={
    cavalry:1000,
    swordsman:1000,
    archer:500
  };

  battle.armies.forEach(army=>{
    army.units=(army.units||[]).filter(unit=>{
      const healthEach=healthPerSoldier[unit.rawType]||0;
      if(healthEach<=0)return Number(unit.count)>0;

      const health=Math.max(0,Number(unit.health));
      unit.count=Math.max(0,Math.floor(health/healthEach));
      return unit.count>0;
    });
  });

  // ارتش‌های بدون هیچ واحد زنده نیز از نبرد حذف می‌شوند.
  battle.armies=battle.armies.filter(army=>(army.units||[]).length>0);
}

function sidchek(){
  const battle=getCurrentBattle();
  if(!battle)return false;

  const units=battle.armies.flatMap(army=>army.units||[]).filter(unit=>Number(unit.count)>0);
  if(!units.length)return false;

  const firstSide=units[0].side;
  const oneSide=units.every(unit=>unit.side===firstSide);

  if(oneSide){
    endbat(firstSide);
    return true;
  }

  return false;
}

function endbat(winningSide){
  if(typeof window.__onlineEndbat === "function"){
    window.__onlineEndbat(winningSide);
    return;
  }
  if(randTimerId){
    clearInterval(randTimerId);
    randTimerId=null;
  }
  randStarted=false;
  randRemainingSeconds=20;

  const battle=getCurrentBattle();
  if(battle){
    battle.ended=true;
    battle.winnerSide=winningSide||null;
  }

  currentBattleForScene=null;
  const scene=document.getElementById("battleScene");
  if(scene)scene.style.display="none";
  const timerBox=document.getElementById("randTimerBox");
  if(timerBox)timerBox.style.display="none";
}

function applyRoundMoves(){
  // این تابع فقط مسئول اجرای حرکت‌هاست؛ سه تابع جنگ در لحظه صفر شدن تایمر فراخوانی می‌شوند.
  // نبرد را هر بار از وضعیت فعلی پیدا می‌کنیم؛ currentBattleForScene ممکن است قدیمی شده باشد.
  const battle=getCurrentBattle();
  if(!battle)return;
  currentBattleForScene=battle;
  const units=battle.armies.flatMap(army=>army.units||[]);
  let moved=false;

  units.forEach(unit=>{
    if(!unit.moveTarget)return;
    const destination=unit.moveTarget;
    const x=Number(destination.slice(1))-1;
    const y="ABCDEFGHIJKLMNOPQRST".indexOf(destination[0]);
    if(x<0||x>11||y<0||y>19)return;
    unit.cell=destination;
    unit.x=x;
    unit.y=y;
    unit.moveTarget=null;
    moved=true;
  });

  const battleScreen=document.getElementById("battle");
  // نمایش نتیجه راند به حرکت وابسته نیست؛ حتی اگر هیچ واحدی حرکت نکند،
  // تعداد نیروهای کم‌شده باید بلافاصله در صحنه نبرد نمایش داده شود.
  if(battleScreen && battleScreen.classList.contains("active")){
    // در نسخه آنلاین نباید بعد از حرکت دوباره از SQL بخوانیم؛
    // چون حرکت هنوز در SQL ذخیره نشده و با خواندن مجدد، موقعیت جدید از بین می‌رود.
    // صحنه را مستقیماً از همان battle محلی که همین راند تغییر کرده رندر می‌کنیم.
    if(typeof window.__renderServerBattleScene === "function"){
      window.__renderServerBattleScene(battle);
    }else{
      viobat();
    }
  }
}

function rand(){
  if(randStarted)return;

  randStarted=true;
  randwar=0;
  randRemainingSeconds=20;

  const box=document.getElementById("randTimerBox");
  const timer=document.getElementById("randTimerValue");
  const war=document.getElementById("randWarValue");

  if(box)box.style.display="block";
  if(timer)timer.textContent="00:20";
  if(war)war.textContent="راند: "+randwar;

  if(randTimerId)clearInterval(randTimerId);
  randTimerId=setInterval(()=>{
    randRemainingSeconds--;

    if(randRemainingSeconds<=0){
      randwar++;
      randRemainingSeconds=20;

      // دقیقاً در لحظه صفر شدن تایمر: jang سپس fotjang سپس sidchek و در پایان حرکت.
      jang();
      fotjang();
      const battleEnded=sidchek();
      if(!battleEnded){
        applyRoundMoves();
      }
    }

    if(timer){
      const mm=String(Math.floor(randRemainingSeconds/60)).padStart(2,"0");
      const ss=String(randRemainingSeconds%60).padStart(2,"0");
      timer.textContent=mm+":"+ss;
    }
    if(war)war.textContent="راند: "+randwar;
  },1000);
}

function batman(){
  if(!attackData)return;
  u.castle=(typeof sqlConnected!=="undefined" && sqlConnected) ? ownerId : selectedCastleId;

  const blocks={
    "مدافع":[
      ["D4","D5","D6","E4","E5","E6"],
      ["D7","D8","D9","E7","E8","E9"],
      ["D1","D2","D3","E1","E2","E3"],
      ["D10","D11","D12","E10","E11","E12"]
    ],
    "مهاجم":[
      ["P4","P5","P6","Q4","Q5","Q6"],
      ["P7","P8","P9","Q7","Q8","Q9"],
      ["P1","P2","P3","Q1","Q2","Q3"],
      ["P10","P11","P12","Q10","Q11","Q12"]
    ]
  };

  function cellXY(cell){
    return {x:Number(cell.slice(1))-1,y:"ABCDEFGHIJKLMNOPQRST".indexOf(cell[0])};
  }

  function normalizeSlots(slots){
    return (Array.isArray(slots)?slots:[]).map(slot=>({
      type:String(slot?.type||""),
      count:Math.max(0,Math.floor(Number(slot?.count)||0))
    })).filter(slot=>names[slot.type]&&slot.count>0).slice(0,6);
  }

  function makeArmy(side,castleId,slots,blockIndex,armyId){
    const block=blocks[side]?.[blockIndex];
    const unitCastle=(typeof sqlConnected!=="undefined" && sqlConnected) ? ownerId : castleId;
    if(!block)return null;
    const normalized=normalizeSlots(slots);
    const units=normalized.map((slot,index)=>{
      const cell=block[index];
      const pos=cellXY(cell);
      return {
        id:String(armyId)+"-unit-"+(index+1),
        type:names[slot.type],
        rawType:slot.type,
        count:slot.count,
        castle:unitCastle,
        side,
        x:pos.x,
        y:pos.y,
        cell,
        health:slot.count*(slot.type==="archer"?500:1000)
      };
    });
    return {armyId:String(armyId),castleId,side,blockIndex,slots:normalized,units};
  }

  const battleKey=String(attackData.targetId);
  let battle=battleRegistry[battleKey];

  // فقط در اولین batman دفاع قلعه هدف گرفته می‌شود و داخل همان نبرد ثابت می‌ماند.
  if(!battle){
    const defenderSlots=normalizeSlots(castles[attackData.targetId].defenseSlots);
    if(defenderSlots.length<1||defenderSlots.length>6){
      alert("برای قلعه هدف هنوز چینش دفاعی ثبت نشده است.");
      return;
    }

    battle={
      batId:nextBattleId++,
      targetId:attackData.targetId,
      defenderSlots:defenderSlots.map(slot=>({...slot})),
      armies:[],
      createdAt:Date.now()
    };

    const defenderArmy=makeArmy(
      "مدافع",
      attackData.targetId,
      battle.defenderSlots,
      0,
      "bat-"+battle.batId+"-defender"
    );
    if(defenderArmy)battle.armies.push(defenderArmy);

    battleRegistry[battleKey]=battle;
    castles[attackData.targetId].underAttack=true;
    castles[attackData.targetId].battleId=battle.batId;
  }

  // ساید از انتخاب صفحه حمله می‌آید؛ در هر batman فقط ارتش جدید اضافه می‌شود.
  const side=attackData.armySide;
  if(side!=="مهاجم"&&side!=="مدافع")return;

  const sameSideArmies=battle.armies.filter(army=>army.side===side);
  const blockIndex=sameSideArmies.length;
  if(blockIndex>=4){
    alert("ظرفیت این ساید در این نبرد تکمیل شده است.");
    return;
  }

  const slots=normalizeSlots(attackData.attackerSlots);
  if(slots.length<1||slots.length>6)return;

  const newArmy=makeArmy(
    side,
    attackData.attackerId,
    slots,
    blockIndex,
    "bat-"+battle.batId+"-army-"+(battle.armies.length+1)
  );
  if(!newArmy)return;

  battle.armies.push(newArmy);

  const allRows=battle.armies.flatMap(army=>army.units||[]);
  allRows.forEach((row,index)=>row.unit=index+1);

  let html=
    '<div class="notice">شماره نبرد: <b>'+battle.batId+'</b> | قلعه هدف: <b>'+battle.targetId+'</b> | ارتش‌های ثبت‌شده: <b>'+battle.armies.length+'</b></div>'+ 
    '<div class="table-wrap"><table class="battle-table"><thead><tr>'+ 
    '<th>شماره واحد نیرو</th><th>نوع نیرو</th><th>تعداد نیرو</th>'+ 
    '<th>شماره قلعه ارسال کننده</th><th>ساید نیرو</th><th>X</th><th>Y</th>'+ 
    '</tr></thead><tbody>';

  allRows.forEach(row=>{
    html+='<tr><td>'+row.unit+'</td><td>'+row.type+'</td><td>'+row.count+'</td><td>'+row.castle+'</td><td>'+row.side+'</td><td>'+row.x+'</td><td>'+row.y+'</td></tr>';
  });
  html+='</tbody></table></div>';

  document.getElementById("battleText").textContent=
    "batman() اجرا شد — نبرد شماره "+battle.batId+
    " | قلعه "+attackData.attackerId+" به قلعه "+attackData.targetId+
    " | ساید ارتش جدید: "+side;

  document.getElementById("battleTables").innerHTML=html;
  document.getElementById("battleScene").style.display="none";
  document.getElementById("castleTimer").style.display="none";
  document.getElementById("castleTimerInfo").style.display="none";
  show("battle");

  // اگر این اولین اجرای rand برای این نبرد باشد و ارتش جدید مهاجم باشد، rand شروع می‌شود.
  if(randwar===0 && side==="مهاجم") rand();
}
function getCurrentBattle(){
  // نبردها با شناسه قلعه هدف ذخیره می‌شوند؛ بنابراین برای تب قلعه مهاجم
  // باید داخل ارتش‌های ثبت‌شده نیز جستجو شود.
  if(attackData){
    const targetBattle=battleRegistry[String(attackData.targetId)];
    if(targetBattle)return targetBattle;
  }

  if(selectedCastleId!==null){
    const directBattle=battleRegistry[String(selectedCastleId)];
    if(directBattle)return directBattle;

    const ownId=String(selectedCastleId);
    for(const key of Object.keys(battleRegistry)){
      const battle=battleRegistry[key];
      if((battle?.armies||[]).some(army=>String(army.castleId)===ownId)){
        return battle;
      }
    }
  }

  return null;
}

<script>
/* ================= ONLINE SERVER BRIDGE =================
   بدون کاربر/رمز: SQL منبع اصلی وضعیت بازی است.
   رابط فعلی بازی و batman فقط به API سرور متصل می‌شوند.
*/
(function(){
  const API="/api";
  let serverState=null;
  let onlinePoll=null;

  async function api(path, options={}){
    const res=await fetch(API+path,{
      headers:{"Content-Type":"application/json",...(options.headers||{})},
      ...options
    });
    const data=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error||"خطا در ارتباط با سرور");
    return data;
  }

  function copyCastle(c){
    if(!c||!castles[c.id]) return;
    castles[c.id].army=c.army||{archer:100,cavalry:100,swordsman:100};
    castles[c.id].defenseSlots=Array.isArray(c.defenseSlots)?c.defenseSlots:[];
    castles[c.id].underAttack=!!c.underAttack;
    castles[c.id].battleId=c.battleId??null;
  }

  async function syncState(){
    const data=await api("/state");
    serverState=data;
    (data.castles||[]).forEach(copyCastle);
    if(selectedCastleId!==null && castles[selectedCastleId]){
      document.getElementById("castleTitle").textContent=castles[selectedCastleId].name+" - شماره قلعه "+selectedCastleId;
    }
    return data;
  }

  function formatSeconds(sec){
    sec=Math.max(0,Math.ceil(Number(sec)||0));
    return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
  }

  /* انتخاب قلعه همچنان فقط انتخاب محلی است؛ اطلاعات قلعه از SQL خوانده می‌شود. */
  window.openCastle=async function(id){
    selectedCastleId=Number(id);
    u.castle=Number(id);
    try{
      await syncState();
      const stats=document.querySelectorAll("#castle .stat b");
      if(stats.length>=3){
        stats[0].textContent=castles[id].army.archer;
        stats[1].textContent=castles[id].army.cavalry;
        stats[2].textContent=castles[id].army.swordsman;
      }

      const pending=await api("/pending?castleId="+encodeURIComponent(id));
      if(pending.attack){
        attackData={
          attackerId:Number(pending.attack.attackerId),
          targetId:Number(pending.attack.targetId),
          armySide:pending.attack.armySide,
          attackId:pending.attack.id,
          arrivesAt:Number(pending.attack.arrivesAt)
        };
        document.getElementById("castleTimer").style.display="block";
        document.getElementById("castleTimerInfo").style.display="block";
        document.getElementById("castleTimerInfo").textContent="یک حمله ثبت‌شده در حال حرکت است.";
        remainingSeconds=Math.max(0,Math.ceil((attackData.arrivesAt-Date.now())/1000));
        if(remainingSeconds>0) beginTimer();
        else await batman();
      }else{
        attackData=null;
        document.getElementById("castleTimer").style.display="none";
        document.getElementById("castleTimerInfo").style.display="none";
      }
    }catch(e){ alert(e.message); return; }
    document.getElementById("castleTitle").textContent=castles[id].name+" - شماره قلعه "+id;
    show("castle");
  };

  window.randomizeAllDefenses=async function(){
    try{
      await api("/defenses/randomize",{method:"POST",body:"{}"});
      await syncState();
      alert("چینش دفاعی تصادفی برای همه قلعه‌ها روی سرور ذخیره شد.");
    }catch(e){ alert(e.message); }
  };

  window.saveDefense=async function(){
    if(selectedCastleId===null)return;
    const slots=readSixSlots("def");
    try{
      await api("/defense/"+selectedCastleId,{
        method:"POST",
        body:JSON.stringify({slots})
      });
      await syncState();
      alert("چینش دفاعی روی سرور ذخیره شد.");
    }catch(e){ alert(e.message); }
  };

  window.startAttack=async function(){
    if(!selectedTargetId)return alert("ابتدا هدف را انتخاب کنید.");
    const slots=collectAttack();
    const used=slots.filter(x=>x.type&&x.count>0);
    if(used.length<1||used.length>6)return alert("هر ارتش باید بین ۱ تا ۶ واحد نیرو داشته باشد.");

    const sideEl=document.getElementById("target-side-"+selectedTargetId);
    const side=sideEl?sideEl.value:"مهاجم";

    try{
      const result=await api("/attack",{
        method:"POST",
        body:JSON.stringify({
          attackerId:Number(selectedCastleId),
          targetId:Number(selectedTargetId),
          armySide:side,
          attackerSlots:slots
        })
      });

      attackData={
        attackerId:Number(selectedCastleId),
        targetId:Number(selectedTargetId),
        armySide:side,
        attackerSlots:slots,
        attackId:result.attack.id,
        startedAt:Date.now(),
        arrivesAt:result.attack.arrivesAt
      };

      remainingSeconds=Math.max(0,Math.ceil((Number(result.attack.arrivesAt)-Date.now())/1000));
      document.getElementById("castleTimer").style.display="block";
      document.getElementById("castleTimerInfo").style.display="block";
      document.getElementById("castleTimerInfo").textContent=
        "حرکت نیروها ثبت شد. زمان رسیدن از روی ساعت سرور محاسبه می‌شود.";
      show("castle");
      beginTimer();

      await syncState();
    }catch(e){ alert(e.message); }
  };

  /* تایمر فقط نمایش است؛ در صفر، تنها batman اجرا می‌شود. */
  window.beginTimer=function(){
    if(timerId)clearInterval(timerId);
    timerId=setInterval(async()=>{
      const left=Math.max(0,Math.ceil((Number(attackData?.arrivesAt||0)-Date.now())/1000));
      remainingSeconds=left;
      const t=document.getElementById("castleTimer");
      if(t)t.textContent=formatSeconds(left);

      if(left<=0){
        clearInterval(timerId);
        timerId=null;
        await batman();
      }
    },250);
  };

  /* batman آنلاین: نتیجه و وضعیت نبرد را از SQL تحویل می‌گیرد. */
  window.batman=async function(){
    if(!attackData?.attackId)return;

    try{
      const data=await api("/attack/"+encodeURIComponent(attackData.attackId)+"/resolve",{
        method:"POST",
        body:"{}"
      });

      serverState=data;
      (data.castles||[]).forEach(copyCastle);

      if(data.battle){
        battleRegistry[String(data.battle.targetId)]=data.battle;
        currentBattleForScene=data.battle;
      }

      const battle=data.battle;
      if(!battle)return;

      const allRows=(battle.armies||[]).flatMap(army=>army.units||[]);
      allRows.forEach((row,index)=>row.unit=index+1);

      let html=
        '<div class="notice">شماره نبرد: <b>'+battle.batId+
        '</b> | قلعه هدف: <b>'+battle.targetId+
        '</b> | ارتش‌های ثبت‌شده: <b>'+battle.armies.length+
        '</b></div><div class="table-wrap"><table class="battle-table"><thead><tr>'+
        '<th>شماره واحد نیرو</th><th>نوع نیرو</th><th>تعداد نیرو</th>'+
        '<th>شماره قلعه ارسال کننده</th><th>ساید نیرو</th><th>X</th><th>Y</th>'+
        '</tr></thead><tbody>';

      allRows.forEach(row=>{
        html+='<tr><td>'+row.unit+'</td><td>'+row.type+'</td><td>'+row.count+
          '</td><td>'+row.castle+'</td><td>'+row.side+'</td><td>'+row.x+
          '</td><td>'+row.y+'</td></tr>';
      });
      html+='</tbody></table></div>';

      document.getElementById("battleText").textContent=
        "batman() اجرا شد — نبرد شماره "+battle.batId+
        " | قلعه "+attackData.attackerId+" به قلعه "+attackData.targetId;

      document.getElementById("battleTables").innerHTML=html;
      document.getElementById("battleScene").style.display="none";
      document.getElementById("castleTimer").style.display="none";
      document.getElementById("castleTimerInfo").style.display="none";
      show("battle");

      // مرجع صحنه را ثابت نگه می‌داریم تا حرکت‌های انتخاب‌شده با رفرش صحنه از بین نروند.
      currentBattleForScene=battle;
      // تایمر راند نبرد باید بعد از ورود به صحنه فعال بماند؛
      // با صفر شدن آن، همان منطق jang/fotjang/sidchek/applyRoundMoves اجرا می‌شود.
      if(!randStarted) rand();

      attackData=null;
      await syncState();
    }catch(e){
      alert(e.message);
    }
  };

  window.viobat=async function(){
    try{
      const battle=await api("/battle/current?castleId="+encodeURIComponent(selectedCastleId));
      if(!battle.battle)return alert("نبردی برای این قلعه پیدا نشد.");
      battleRegistry[String(battle.battle.targetId)]=battle.battle;
      currentBattleForScene=battle.battle;

      /* تابع اصلی صحنه از همان داده SQL استفاده می‌کند. */
      const originalScene=window.__originalViobat;
      if(originalScene) originalScene();
    }catch(e){ alert(e.message); }
  };

  /* پایان نبرد آنلاین: اطلاعات نبرد از SQL حذف می‌شود. */
  window.__onlineEndbat=async function(winningSide){
    const battle=getCurrentBattle();
    if(!battle?.batId)return;
    try{
      await api("/battle/"+encodeURIComponent(battle.batId)+"/end",{method:"POST",body:"{}"});
      delete battleRegistry[String(battle.targetId)];
      currentBattleForScene=null;
      attackData=null;
      const scene=document.getElementById("battleScene");
      if(scene)scene.style.display="none";
      const timerBox=document.getElementById("randTimerBox");
      if(timerBox)timerBox.style.display="none";
      await syncState();
      show("castle");
    }catch(e){
      alert(e.message);
    }
  };

  /* رفرش دوره‌ای فقط برای همگام‌سازی وضعیت؛ تایمر حمله همچنان سروری است. */
  async function onlineInit(){
    try{
      await syncState();
      renderCastles();
      if(!onlinePoll){
        onlinePoll=setInterval(async()=>{
          try{
            const data=await syncState();
            serverState=data;
            const activeBattle=getCurrentBattle();
            if(activeBattle?.endsAt && Date.now()>=Number(activeBattle.endsAt)){
              await endbat();
              return;
            }
            if(selectedCastleId!==null && document.getElementById("castle").classList.contains("active")){
              const c=castles[selectedCastleId];
              const stats=document.querySelectorAll("#castle .stat b");
              if(stats.length>=3){
                stats[0].textContent=c.army.archer;
                stats[1].textContent=c.army.cavalry;
                stats[2].textContent=c.army.swordsman;
              }
            }
          }catch(e){}
        },3000);
      }
    }catch(e){
      alert("اتصال به سرور برقرار نشد: "+e.message);
    }
  }

  /* توابعی که قبل از bridge در فایل تعریف شده‌اند در onclickهای قدیمی ثبت شده‌اند؛
     بنابراین دکمه‌ها را دوباره به نسخه آنلاین وصل می‌کنیم. */
  window.__originalViobat=window.viobat;
  window.viobat=async function(){
    try{
      const result=await api("/battle/current?castleId="+encodeURIComponent(selectedCastleId));
      if(!result.battle)return alert("نبردی برای این قلعه پیدا نشد.");
      battleRegistry[String(result.battle.targetId)]=result.battle;
      currentBattleForScene=result.battle;
      window.__onlineBattle=result.battle;
      window.__renderServerBattleScene(result.battle);
    }catch(e){ alert(e.message); }
  };

  /* رندر مستقیم صحنه از battle ذخیره‌شده در SQL */
  window.__renderServerBattleScene=function(battle){
    currentBattleForScene=battle;
    const units=(battle.armies||[]).flatMap(a=>a.units||[]);
    const unitMap=new Map(units.map(x=>[x.cell,x]));
    const scene=document.getElementById("battleScene");
    const defenderView=(battle.armies||[]).some(a=>String(a.castleId)===String(selectedCastleId)&&a.side==="مدافع");

    let out='<div class="battle-scene-wrap"><h3>صحنه نبرد — ۱۲ ستون × ۲۰ ردیف</h3><div class="battle-grid">';
    for(let visualY=0;visualY<20;visualY++){
      const y=defenderView?19-visualY:visualY;
      const rowWidth=(55.2+(visualY/19)*36.8).toFixed(3);
      out+='<div class="battle-row" style="--row-width:'+rowWidth+'%">';
      for(let visualX=0;visualX<12;visualX++){
        const x=defenderView?11-visualX:visualX;
        const cell=String.fromCharCode(65+y)+(x+1);
        const unit=unitMap.get(cell);
        const cls=unit?(unit.side==="مهاجم"?"attacker":"defender"):"";
        out+='<div class="battle-cell '+cls+'" data-cell="'+cell+'"><small>'+cell+'</small>';
        if(unit){
          const imgType=unit.rawType||"";
          const side=unit.side==="مهاجم"?1:2;
          const src=imgType ? ("/images/" + imgType + (side===1 ? "1" : "2") + ".png") : "";
          const canSelect=String(unit.castle)===String(selectedCastleId);
          out+='<button type="button" class="battle-unit '+(canSelect?"selectable":"not-selectable")+'" data-unit-id="'+unit.id+'" data-castle="'+unit.castle+'">';
          out+='<img src="'+src+'" alt="'+unit.type+'">';
          out+='<span class="unit-image-fallback">'+unit.type+'</span>';
          out+='<span class="army-number">'+((battle.armies||[]).findIndex(a=>(a.units||[]).some(z=>String(z.id)===String(unit.id)))+1)+'</span>';
          out+='<span class="unit-count">'+unit.count+'</span></button>';
        }
        out+='</div>';
      }
      out+='</div>';
    }
    out+='</div></div>';
    scene.innerHTML=out;
    scene.style.display="block";

    // انتخاب نیروهای خود بازیکن و انتخاب خانه مقصد مثل صحنه آفلاین
    let selectedUnitId=null;
    const moveRange=function(unit){
      const range=(unit.rawType==="cavalry")?2:1;
      const cells=[];
      for(let y=Math.max(0,Number(unit.y)-range);y<=Math.min(19,Number(unit.y)+range);y++){
        for(let x=Math.max(0,Number(unit.x)-range);x<=Math.min(11,Number(unit.x)+range);x++){
          if(x===Number(unit.x)&&y===Number(unit.y))continue;
          cells.push(String.fromCharCode(65+y)+(x+1));
        }
      }
      return cells;
    };
    const refreshRange=function(){
      scene.querySelectorAll('.battle-cell.move-option').forEach(c=>c.classList.remove('move-option'));
      scene.querySelectorAll('.battle-cell.move-target').forEach(c=>c.classList.remove('move-target'));
      if(!selectedUnitId)return;
      const unit=units.find(item=>String(item.id)===String(selectedUnitId));
      if(!unit)return;
      const range=new Set(moveRange(unit));
      scene.querySelectorAll('.battle-cell').forEach(c=>{
        if(range.has(c.dataset.cell))c.classList.add('move-option');
      });
      if(unit.moveTarget){
        const target=scene.querySelector('.battle-cell[data-cell="'+unit.moveTarget+'"]');
        if(target)target.classList.add('move-target');
      }
    };
    const selectUnit=function(unit){
      selectedUnitId=String(unit.id);
      scene.querySelectorAll('.battle-unit.selected').forEach(x=>x.classList.remove('selected'));
      const btn=scene.querySelector('.battle-unit[data-unit-id="'+unit.id+'"]');
      if(btn)btn.classList.add('selected');
      scene.querySelectorAll('.battle-cell.selected-cell').forEach(x=>x.classList.remove('selected-cell'));
      const cell=scene.querySelector('.battle-cell[data-cell="'+unit.cell+'"]');
      if(cell)cell.classList.add('selected-cell');
      refreshRange();
    };
    scene.querySelectorAll('.battle-unit').forEach(btn=>{
      btn.addEventListener('click',function(e){
        e.stopPropagation();
        const unit=units.find(item=>String(item.id)===String(this.dataset.unitId));
        if(unit && String(unit.castle)===String(selectedCastleId))selectUnit(unit);
      });
    });
    scene.querySelectorAll('.battle-cell').forEach(cell=>{
      cell.addEventListener('click',function(){
        if(!selectedUnitId)return;
        const unit=units.find(item=>String(item.id)===String(selectedUnitId));
        if(!unit)return;
        const destination=this.dataset.cell;
        if(!moveRange(unit).includes(destination))return;
        unit.moveTarget=destination;
        currentBattleForScene=battle;
        refreshRange();
      });
    });
  };

  document.getElementById("randomDefenseBtn").onclick=window.randomizeAllDefenses;
  document.getElementById("attackBtn").onclick=()=>{renderTargets();show("targets");};
  document.getElementById("defenseBtn").onclick=()=>{renderDefense();show("defense");};
  document.getElementById("saveDefense").onclick=window.saveDefense;
  document.getElementById("startAttack").onclick=window.startAttack;
  document.getElementById("battleSceneBtn").onclick=window.viobat;
  document.getElementById("resetAllBattlesBtn").onclick=async function(){
    if(!confirm("همه نبردها، حمله‌های در حال حرکت و وضعیت دفاعی پاک شود و بازی به حالت ابتدای نصب برگردد؟"))return;
    try{
      await api("/reset-game",{method:"POST"});
      selectedCastleId=null;
      selectedTargetId=null;
      attackData=null;
      currentBattleForScene=null;
      Object.keys(battleRegistry).forEach(k=>delete battleRegistry[k]);
      await syncState();
      renderCastles();
      show("select");
      alert("همه نبردها بسته شد و بازی به حالت ابتدای نصب برگشت.");
    }catch(e){ alert(e.message); }
  };

  /* بعد از لود اولیه، داده SQL جای داده محلی را می‌گیرد. */
  onlineInit();
})();
</script>
</body></html>
